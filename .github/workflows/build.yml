name: Build and deploy the Skill Library

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"   # daily, after the personal site refreshes newsletter.json
  workflow_dispatch:
  repository_dispatch:
    types: [skills-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lingegrace/claude-research-skills
          path: skills-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7 pyyaml==6.0.2
      - run: python build.py
        env:
          SKILLS_DIR: skills-src
          OUT_DIR: _site
          BASE: /skills/
      - name: Keep the cached newsletter copy fresh
        run: |
          if [ -n "$(git status --porcelain -- data/newsletter.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/newsletter.json && git commit -m "Update cached newsletter issues" && git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
