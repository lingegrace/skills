# Site settings for Grace's Skill Library.

# Where "Request a skill", feedback (the lamp) and custom-skill forms are sent.
# Use the Web app URL of the Google Apps Script in backend/google-sheet-receiver.gs
# (looks like https://script.google.com/macros/s/…/exec). Each message becomes a row in your Google Sheet
# and you get an email. Leave empty until it's set up: forms then say they aren't connected yet.
form_endpoint: ""

# Google Form (preferred). Paste the form's "formResponse" URL and the entry IDs of its four questions.
# Get them from the form's "Get pre-filled link" (see backend/google-form-setup.md). When action is set,
# all three forms (request a skill, feedback lamp, custom skill) submit straight into the Google Form.
google_form:
  action: "https://docs.google.com/forms/d/e/1FAIpQLScDFYcgyxYSzNpi5qQCAhO7kHfMeUmsz7J92VSNvm6SyZDGTw/formResponse"
  fields:
    type: "entry.1241490579"
    message: "entry.329111907"
    email: "entry.1396407127"
    page: "entry.1847325453"

# Claude Code plugin for each drawer (see .claude-plugin/marketplace.json in the skills repo).
plugins:
  social-science: social-science-research-skills
  market-research: market-research-skills
  writing: writing-skills
  work: work-skills
  learning: learning-skills
  marketing: marketing-skills
  product: product-skills
  skill-engineering: skill-engineering-skills

# Cards in the swipeable stack on the home page.
hero_stack: [deep-research, meeting-to-actions, human-writing, literature-review, value-proposition-writer, socratic-tutor]

# "I'm a…" picker on the home page.
personas:
  - label: Student
    heading: ["I'm a", "student"]
    line: Read faster, write clearer, and revise smarter for your degree.
    skills: [literature-review, paper-tutor, academic-editing, thesis-chapter-review, citation-formatter, active-recall]
  - label: Researcher
    heading: ["I'm a", "researcher"]
    skills: [research-question-grill, deep-research, interview-guide, thematic-analysis, survey-design, quantitative-analysis]
  - label: Marketer
    heading: ["I'm a", "marketer"]
    line: Know the customer, find the message, and ship pages that convert.
    skills: [customer-review-mining, positioning-messaging, seo-research, landing-page-writer, content-repurposing, competitor-messaging]
  - label: Product manager
    heading: ["I'm a", "product manager"]
    line: Discover the right problem, then write it down so everyone builds the same thing.
    skills: [product-discovery, prd-writer, value-proposition-writer, user-persona-builder, decision-memo, competitor-analysis]
  - label: Content creator
    heading: ["I'm a", "content creator"]
    line: Find topics worth writing, research them properly, and sound like yourself.
    skills: [topic-discovery, content-research-analyst, linkedin-writer, newsletter-writer, my-writing-voice, fact-check-draft]
  - label: Anyone at work
    heading: ["I just need help", "at work"]
    line: The documents everyone writes, done in a fraction of the time.
    skills: [meeting-to-actions, weekly-report, executive-writing, decision-memo, document-review, sop-builder]
  - label: Exam & career prep
    heading: ["I need", "exam & career prep"]
    line: Practice with a patient tutor, find your weak spots, and walk into the room ready.
    skills: [ielts-writing-coach, study-plan-builder, mistake-analysis, socratic-tutor, interview-practice, resume-review]

