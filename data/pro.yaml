faq:
  - q: Are the free skills really free?
    a: Yes. They're open source under the MIT license, which means anyone can use, copy, change and share them, including at work and in commercial projects. The only condition is keeping the short copyright notice in the files. I chose this license so the free skills can spread as widely as possible.
  - q: What's the difference between a free skill and a Pro skill?
    a: A free skill does one job well, like turning a meeting into action items. A Pro skill runs a whole workflow of many steps, like going from a research question to a fact-checked, published article, and stops at checkpoints for your approval.
  - q: What does a skill actually do?
    a: A skill is a set of instructions Claude loads when your request matches it. It makes Claude work like a careful specialist for that job, asking the right questions first, following a named method, and producing a fixed kind of output.
  - q: Which Claude plans and apps work?
    a: Claude Code, Claude.ai and the Claude desktop app, on any plan where Skills are enabled. Skills are plain Markdown, so other agents that support the Agent Skills format can use them too.
  - q: Do the skills browse the web or see my data?
    a: A skill doesn't add web access or send your data anywhere. It works with what you give Claude, and uses web search only if your Claude setup already has it.
  - q: How does a custom skill work?
    a: Tell me about the work you want packaged. We'll talk through what you start from, what you need to hand in and how you judge quality. I'll design the skill around that and test it on your real material before you use it.

refunds: >-
  The refund policy for Pro purchases will be published here before Pro opens. Free skills cost nothing, so there's nothing to refund.
