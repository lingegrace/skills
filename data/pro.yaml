# Pro / paid skills. Edit this file to set prices and checkout links.
# When a plan has a checkout_url (Lemon Squeezy, Gumroad, Stripe Payment Link…), its button becomes "Buy".
# Without one, the button is "Join the waitlist" (opens an email).

intro: >-
  Everything in the catalog is free and stays free. Pro adds deeper, done-for-you workflows for academic and
  content work, plus early access to new skills. Pro is not open yet. Join the waitlist and you'll hear first.

plans:
  - name: Free
    price: "$0"
    note: Forever, MIT-licensed
    includes:
      - Every skill in the catalog
      - Install in Claude Code, Claude.ai or the desktop app
      - All Workshop lessons
    cta: Browse the catalog
    checkout_url: /skills/skills/
  - name: Pro skill
    price: Coming soon
    note: Buy one skill, keep it forever
    highlight: true
    includes:
      - One Pro skill, with all future updates
      - Worked examples and templates
      - Email support
  - name: Library pass
    price: Coming soon
    note: Every Pro skill, including new ones
    includes:
      - All Pro skills
      - Every new Pro skill as it ships
