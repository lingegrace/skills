# The six Pro skills. Each gets its own page at /pro/<slug>/.
# A skill with a `page:` block gets the full page (claim, problem, research, method, input/output, pricing).
# Without one it gets a short page with a waitlist. Never put numbers in `research` until the study has run.
skills:
  - slug: your-voice
    name: Your Voice
    field: Writing
    tagline: AI that writes like you, not like "a human"
    summary: Learns your voice from your own writing, then edits each AI draft sentence by sentence toward it, and re-checks when the model changes.
    stages: 5 stages · checkpoint on your voice profile
    page:
      claim: Don't scrub the AI out. Teach it your voice.
      lede: Most "de-AI" tools delete patterns until the text sounds like nobody in particular. Your Voice works the other way. It starts from how you write, and moves each draft toward you, case by case.
      problem:
        - Removing "AI tells" makes text generic, not personal. A draft with every dash and "not only… but also" stripped out still doesn't sound like you.
        - The tells change. Each new model writes differently, so a fixed list of banned phrases goes stale within months.
        - What matters is case by case. A contrast or a list can be exactly right in one sentence and filler in the next. Only your own writing can tell which.
      research_intro: I'm running the study behind this skill now, as a sociologist would. The design is below; the findings will be published here, with their limits, once the data is in.
      research_design:
        - title: Your writing as the baseline
          text: A corpus of the author's own published writing, compared with drafts that different models write on the same topics from the same notes.
        - title: Across models and versions
          text: The same prompts run on several current models, and again on each new version, to see which differences fade as models change and which persist.
        - title: Blind reading
          text: Readers who know the author's work judge, without labels, which version sounds like the author, and why.
        - title: What gets measured
          text: Sentence rhythm, how ideas are linked, how claims are hedged, word choice, structure, and the moves that make a piece recognisably the author's.
      method:
        - title: Learn your voice
          text: Read 5–20 pieces you wrote and build a voice profile, with examples from your own text for each trait.
        - title: Read the draft against it
          text: Go through an AI draft sentence by sentence and mark where it drifts from your profile, and how.
        - title: Edit lightly
          text: Change only what drifts. Keep every fact and every point; never add claims.
        - title: Show every change
          text: A side-by-side view, with the reason for each edit, so you stay the judge.
        - title: Re-check when models change
          text: Re-run your profile against a new model's drafts and update what no longer applies.
      input: 5–20 pieces of your own writing, plus the AI draft you want to fix.
      output: A voice profile, the draft annotated sentence by sentence, the revised draft and a change log.
      demo_note: A real before-and-after, from the study, will be shown here.
  - slug: research-dossier
    name: Research Dossier
    field: Research
    tagline: A research report you can defend
    summary: A sociologist's research workflow, from question to literature map, evidence ledger, claim checks and a synthesis, with your approval at each checkpoint.
    stages: 8 stages · 2 checkpoints
  - slug: research-to-article
    name: Research to Article
    field: Writing
    tagline: From a question to a published article
    summary: Research, angle, outline, a draft in your voice, a fact-check and a publishing package, the way I write my newsletter.
    stages: 9 stages · 2 checkpoints
  - slug: market-research
    name: Market & Competitor Research
    field: Marketing
    tagline: A market judgment you can defend
    summary: Define the question, map competitors, gather tiered evidence, compare, find the white space and write the judgment memo.
    stages: 8 stages · 2 checkpoints
  - slug: pm-research
    name: PM Research to Decision
    field: Product
    tagline: User, competitor and market research to a decision
    summary: Pulls user research, competitors and the market into an opportunity tree, a prioritized recommendation and a PRD seed.
    stages: 7 stages · checkpoint on priorities
  - slug: skill-eval
    name: Skill Eval System
    field: Skill engineering
    tagline: Test and track your team's skills
    summary: Criteria for each skill, a test set, baseline runs, scoring, and regression tracking across versions before you ship changes.
    stages: 7 stages · checkpoint before each release

faq:
  - q: Are the free skills really free?
    a: Yes. They're open source under the MIT license, which means anyone can use, copy, change and share them, including at work and in commercial projects. The only condition is keeping the short copyright notice in the files. I chose this license so the free skills can spread as widely as possible.
  - q: What's the difference between a free skill and a Pro skill?
    a: A free skill does one job well, like turning a meeting into action items. A Pro skill runs a whole workflow of many steps, like going from a research question to a fact-checked, published article, and stops at checkpoints for your approval.
  - q: What does a skill actually do?
    a: A skill is a set of instructions Claude loads when your request matches it. It makes Claude work like a careful specialist for that job, asking the right questions first, following a named method, and producing a fixed kind of output.
  - q: Which Claude plans and apps work?
    a: Claude Code, Claude.ai and the Claude desktop app, on any plan where Skills are enabled. Skills are plain Markdown, so other agents that support the Agent Skills format can use them too.
  - q: Do the skills browse the web or see my data?
    a: A skill doesn't add web access or send your data anywhere. It works with what you give Claude, and uses web search only if your Claude setup already has it.
  - q: How does a custom skill work?
    a: Tell me about the work you want packaged. We'll talk through what you start from, what you need to hand in and how you judge quality. I'll design the skill around that and test it on your real material before you use it.

refunds: >-
  The refund policy for Pro purchases will be published here before Pro opens. Free skills cost nothing, so there's nothing to refund.
