# Pro skills appear here once approved. Leave empty to hide the section.
skills: []

faq:
  - q: Are the free skills really free?
    a: Yes. They are MIT-licensed on GitHub. You can use, change and share them, including at work.
  - q: What does a skill actually do?
    a: A skill is a set of instructions Claude loads when your request matches it. It turns Claude into a careful specialist for one job, such as a Braun & Clarke thematic analysis or a value proposition, with fixed steps and a fixed output.
  - q: Which Claude plans and apps work?
    a: Claude Code, Claude.ai and the Claude desktop app, on any plan where Skills are enabled. Skills are plain Markdown, so other agents that support the Agent Skills format can use them too.
  - q: Do the skills browse the web or see my data?
    a: A skill doesn't add web access or send your data anywhere. It works with what you give Claude, and with web search only if your Claude setup already has it.
  - q: When will Pro open?
    a: Join the waitlist and you'll get an email when it opens.

refunds: >-
  The refund policy for Pro purchases will be published here before Pro opens. Free skills cost nothing, so there's nothing to refund.
